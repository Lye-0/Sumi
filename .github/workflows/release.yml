name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run offline regression checks
        shell: pwsh
        run: dotnet run --project tests/Sumi.Tests -c Release
      - name: Package Windows builds
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: packages
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check *.sha256
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'A published release already exists. Use a new version tag.' >&2
              exit 1
            fi
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Sumi $RELEASE_TAG" "${options[@]}"
          fi
          # Upload separately so a failure can be retried for that asset alone.
          for asset in ./*.zip ./*.sha256; do
            uploaded=false
            for attempt in 1 2 3; do
              echo "Uploading $(basename "$asset") (attempt $attempt/3)"
              if timeout 180s gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                uploaded=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            if [ "$uploaded" != true ]; then
              echo "Upload failed: $asset. Release remains a draft." >&2
              exit 1
            fi
          done
          # Verify GitHub's recorded digest, size and state before publishing.
          gh release view "$RELEASE_TAG" --json assets > /tmp/sumi-release-assets.json
          for asset in ./*.zip ./*.sha256; do
            name=$(basename "$asset")
            size=$(stat -c %s "$asset")
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            jq -e --arg name "$name" --argjson size "$size" --arg digest "$digest" \
              '[.assets[] | select(.name == $name and .state == "uploaded" and .size == $size and .digest == $digest)] | length == 1' \
              /tmp/sumi-release-assets.json > /dev/null
          done
          gh release edit "$RELEASE_TAG" --draft=false
